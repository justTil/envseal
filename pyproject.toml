[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "envseal"
dynamic = ["version"]
description = "Encrypt sensitive values in environment files using AES-GCM"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Til Schwarze", email = "tschwarze@envseal.org" }]
keywords = [
    "encryption",
    "environment",
    "secrets",
    "security",
    "obfuscation",
    "aes",
    "aes-gcm",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=46.0.1",
    "keyring>=25.6.0",
    "python-dotenv>=1.1.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "pytest", "build", "ruff"]
cf_docs = ["mkdocs>=1.5.0", "mkdocs-material", "mkdocstrings-python"]

[project.urls]
Homepage = "https://github.com/justTil/envseal"
Documentation = "https://docs.envseal.org"
Issues = "https://github.com/justTil/envseal/issues"

[project.scripts]
envseal = "envseal.cli:main"

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "src/envseal/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/envseal"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
